name: devworkspace_generic_debian
services:
    terminal:
        build:
            context: ..
            dockerfile: generic-debian/Dockerfile
        image: publishpress/dev-workspace-terminal:generic-debian
        command: ["/bin/bash", "-l"]
        stdin_open: true
        tty: true
        environment:
            HOST_UID: ${HOST_UID:-}
            HOST_GID: ${HOST_GID:-}
        working_dir: "/project"
        volumes:
            - ../generic/tests:/tests
            - ../generic/tests/fake-plugin:/project
