name: devworkspace_generic
services:
    terminal:
        build: .
        image: publishpress/dev-workspace-terminal:generic-6.0.1
        command: ["/bin/zsh", "-l"]
        stdin_open: true
        tty: true
        environment:
            HOST_UID: ${HOST_UID:-}
            HOST_GID: ${HOST_GID:-}
        working_dir: "/project"
        volumes:
            - ./tests:/tests
            - ./tests/fake-plugin:/project
            - ./scripts:/scripts
